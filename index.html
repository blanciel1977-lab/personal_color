<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>퍼스널컬러 진단</title>
  <meta name="description" content="17문항으로 찾는 12타입 퍼스널컬러" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a1520;
      --muted: #6b6570;
      --cream: #faf7f4;
      --blush: #f3e8e2;
      --accent: #c45c3e;
      --accent-dark: #9e3f28;
      --line: #e8e0d8;
      --white: rgba(255,255,255,.82);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      font-family: 'Outfit', 'Noto Sans KR', system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 10% -10%, #f5d9c8 0%, transparent 50%),
        radial-gradient(ellipse 60% 40% at 90% 0%, #d8e4f0 0%, transparent 45%),
        radial-gradient(ellipse 50% 30% at 50% 100%, #e8d5e0 0%, transparent 40%),
        var(--cream);
      -webkit-font-smoothing: antialiased;
    }
    #app { max-width: 32rem; margin: 0 auto; padding: 2rem 1.25rem 3rem; min-height: 100svh; }
    .eyebrow { font-size: .8rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); margin: 0 0 .75rem; }
    h1 { font-size: clamp(2rem, 6vw, 2.75rem); line-height: 1.15; letter-spacing: -.03em; margin: 0 0 1rem; }
    h2 { font-size: 1.4rem; line-height: 1.35; margin: 0 0 .5rem; }
    h3 { font-size: 1rem; margin: 0 0 .6rem; }
    p { margin: 0; color: var(--muted); line-height: 1.6; }
    .lead { margin-bottom: 1.75rem; max-width: 24rem; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; margin-bottom: 1.75rem; }
    .card {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 1rem;
      padding: .85rem 1rem;
      backdrop-filter: blur(6px);
    }
    .card strong { display: block; font-size: .9rem; }
    .card span { font-size: .75rem; color: var(--muted); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 100%; border: 0; border-radius: 1rem; padding: 1rem 1.25rem;
      font: inherit; font-weight: 600; cursor: pointer; transition: .15s ease;
    }
    .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 10px 24px rgba(196,92,62,.25); }
    .btn-primary:hover { background: var(--accent-dark); }
    .btn-primary:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); width: auto; padding: .85rem 1.1rem; }
    .btn-ghost:disabled { opacity: .4; }
    .hint { margin-top: 1rem; text-align: center; font-size: .75rem; color: var(--muted); }
    .progress-meta { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-bottom: .5rem; }
    .bar { height: .35rem; background: var(--line); border-radius: 999px; overflow: hidden; }
    .bar > i { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width .35s ease; }
    .badge {
      display: inline-block; margin: 1.5rem 0 .75rem; padding: .3rem .7rem;
      border-radius: 999px; background: var(--blush); color: var(--accent);
      font-size: .75rem; font-weight: 700;
    }
    .choices { display: grid; gap: .7rem; margin: 1.25rem 0 1.75rem; }
    .choice {
      text-align: left; background: var(--white); border: 1px solid var(--line);
      border-radius: 1rem; padding: 1rem 1.1rem; font: inherit; font-weight: 500;
      cursor: pointer; transition: .15s ease; color: var(--ink);
    }
    .choice:hover { border-color: rgba(196,92,62,.4); background: #fff; }
    .choice.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .nav { display: flex; gap: .75rem; }
    .nav .btn-primary { flex: 1; }
    .center { text-align: center; }
    .accent-line { width: 4rem; height: .35rem; border-radius: 999px; margin-bottom: 1rem; }
    .palette { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .5rem; }
    .swatch { width: 2.5rem; height: 2.5rem; border-radius: 999px; border: 1px solid rgba(0,0,0,.08); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
    .swatch.sm { width: 2rem; height: 2rem; }
    .section { background: var(--white); border: 1px solid var(--line); border-radius: 1.25rem; padding: 1.15rem; margin-bottom: 1rem; }
    .label { font-size: .85rem; font-weight: 600; color: var(--muted); margin-bottom: .4rem; }
    ul { margin: 0; padding: 0; list-style: none; }
    li { display: flex; gap: .55rem; font-size: .9rem; color: var(--muted); line-height: 1.5; margin-bottom: .45rem; }
    li::before { content: ''; width: .4rem; height: .4rem; border-radius: 999px; background: var(--dot, var(--accent)); margin-top: .55rem; flex: 0 0 auto; }
    .warn { background: #fff8eb; border: 1px solid #f5e0a8; color: #7a5a12; border-radius: 1rem; padding: .85rem 1rem; font-size: .9rem; margin-bottom: 1rem; }
    .similar { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
    .fade { animation: fade .35s ease both; }
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  </style>
</head>

":{"value":1}},{"id":"v3b","label":"중간 브라운","scores":{"value":0}},{"id":"v3c","label":"짙은 브라운·거의 블랙","scores":{"value":-1}}]},{"id":"v4","category":"value","text":"전체적인 인상은 어떤가요?","choices":[{"id":"v4a","label":"맑고 가벼운 인상","scores":{"value":1}},{"id":"v4b","label":"중간적인 인상","scores":{"value":0}},{"id":"v4c","label":"무겁고 깊은 인상","scores":{"value":-1}}]},{"id":"c1","category":"contrast","text":"피부·눈·머리의 톤 차이는 어떤가요?","choices":[{"id":"c1a","label":"비슷한 톤이라 부드러운 인상","scores":{"contrast":-1}},{"id":"c1b","label":"어느 정도 차이가 있다","scores":{"contrast":0}},{"id":"c1c","label":"대비가 뚜렷해 선명한 인상","scores":{"contrast":1}}]},{"id":"c2","category":"contrast","text":"메이크업은 어떤 스타일이 더 잘 받나요?","choices":[{"id":"c2a","label":"연하고 자연스러운 메이크업","scores":{"contrast":-1}},{"id":"c2b","label":"중간 정도의 메이크업","scores":{"contrast":0}},{"id":"c2c","label":"또렷한 아이라인·립이 잘 맞는다","scores":{"contrast":1}}]},{"id":"c3","category":"contrast","text":"흑백 사진으로 찍었을 때 인상은?","choices":[{"id":"c3a","label":"부드럽고 은은하다","scores":{"contrast":-1}},{"id":"c3b","label":"보통이다","scores":{"contrast":0}},{"id":"c3c","label":"선명하고 또렷하다","scores":{"contrast":1}}]},{"id":"ch1","category":"chroma","text":"옷 색상 중 어떤 쪽이 얼굴을 더 살려주나요?","choices":[{"id":"ch1a","label":"선명한 원색·비비드 컬러","scores":{"chroma":1}},{"id":"ch1b","label":"중간 정도의 색","scores":{"chroma":0}},{"id":"ch1c","label":"탁하고 부드러운 파스텔·어스톤","scores":{"chroma":-1}}]},{"id":"ch2","category":"chroma","text":"네온·비비드한 색을 입으면?","choices":[{"id":"ch2a","label":"얼굴에 생기가 돌고 잘 어울린다","scores":{"chroma":1}},{"id":"ch2b","label":"때에 따라 다르다","scores":{"chroma":0}},{"id":"ch2c","label":"얼굴이 칙칙해지거나 부담스럽다","scores":{"chroma":-1}}]},{"id":"ch3","category":"chroma","text":"패턴·프린트는 어떤 스타일이 더 잘 맞나요?","choices":[{"id":"ch3a","label":"선명한 대비가 있는 패턴","scores":{"chroma":1,"contrast":0.5}},{"id":"ch3b","label":"중간 정도","scores":{"chroma":0}},{"id":"ch3c","label":"은은한 톤온톤·뮤트한 패턴","scores":{"chroma":-1,"contrast":-0.5}}]},{"id":"p1","category":"palette","text":"아래 두 팔레트 중, 얼굴이 더 환해 보일 것 같은 쪽은?","hint":     const CATEGORY_LABEL = {"undertone":"언더톤","value":"명도","contrast":"대비","chroma":"채도","palette":"팔레트"};
    const SEASON_LABEL = {"spring":"봄","summer":"여름","autumn":"가을","winter":"겨울"};
    const SEASON_ACCENT = {"spring":"#E87A3D","summer":"#6B8FBF","autumn":"#A0673B","winter":"#2C3E6B"};
    const AXES = ['undertone', 'value', 'contrast', 'chroma'];

    let screen = 'home';
    let step = 0;
    let answers = {};

    function aggregateScores(ans) {
      const sums = { undertone: 0, value: 0, contrast: 0, chroma: 0 };
      const counts = { undertone: 0, value: 0, contrast: 0, chroma: 0 };
      for (const q of QUESTIONS) {
        const choice = q.choices.find(c => c.id === ans[q.id]);
        if (!choice) continue;
        for (const axis of AXES) {
          if (choice.scores[axis] !== undefined) {
            sums[axis] += choice.scores[axis];
            counts[axis] += 1;
          }
        }
      }
      const result = {};
      for (const axis of AXES) {
        result[axis] = counts[axis] > 0 ? sums[axis] / counts[axis] : 0;
      }
      return result;
    }

    function matchType(scores) {
      const distances = COLOR_TYPES.map(type => {
        let sum = 0;
        for (const axis of AXES) {
          const d = scores[axis] - type.ideal[axis];
          sum += d * d;
        }
        return { type, distance: Math.sqrt(sum) };
      }).sort((a, b) => a.distance - b.distance);
      return {
        primary: distances[0].type,
        similar: distances.slice(1, 3).map(d => d.type),
        isBorderline: Math.abs(scores.undertone) < 0.2,
      };
    }

    function swatches(colors, small) {
      return '<div class="palette">' + colors.map(c =>
        '<div class="swatch' + (small ? ' sm' : '') + '" style="background:' + c + '" title="' + c + '"></div>'
      ).join('') + '</div>';
    }

          <div class="progress-meta"><span>${step + 1} / ${QUESTIONS.length}</span><span>${pct}%</span></div>
          <div class="bar"><i style="width:${pct}%"></i></div>
          <span class="badge">${CATEGORY_LABEL[q.category]}</span>
          <h2>${q.text}</h2>
          ${q.hint ? '<p>' + q.hint + '</p>' : ''}
          <div class="choices">
            ${q.choices.map(c =>
              '<button class="choice' + (selected === c.id ? ' active' : '') + '" data-id="' + c.id + '">' + c.label + '</button>'
            ).join('')}
          </div>
          <div class="nav">
            <button class="btn btn-ghost" id="prev" ${step === 0 ? 'disabled' : ''}>이전</button>
            <button class="btn btn-primary" id="next" ${selected ? '' : 'disabled'}>
              ${step === QUESTIONS.length - 1 ? '결과 보기' : '다음'}
            </button>
          </div>
        </div>
      `;
    }

    function renderResult() {
      const { primary, similar, isBorderline } = matchType(aggregateScores(answers));
      const accent = SEASON_ACCENT[primary.season];
      return `
        <div class="fade center">
          <p class="eyebrow" style="color:${accent}">${SEASON_LABEL[primary.season]} · ${primary.nameEn}</p>
          <h1 style="margin-bottom:.75rem">${primary.nameKo}</h1>
          <p class="lead" style="margin-left:auto;margin-right:auto">${primary.description}</p>
        </div>
        ${isBorderline ? '<div class="warn">언더톤이 웜/쿨 경계에 가깝습니다. 유사 타입도 함께 참고해 보세요.</div>' : ''}
        <div class="section fade">
          <div class="accent-line" style="background:${accent}"></div>
          <div class="label">추천 컬러</div>
          ${swatches(primary.bestColors)}
          <div style="height:1rem"></div>
          <div class="label">피하면 좋은 컬러</div>
          ${swatches(primary.avoidColors, true)}
        </div>
        <div class="section fade">
          <h3>이런 특징이 있어요</h3>
          <ul>${primary.traits.map(t => '<li style="--dot:' + accent + '">' + t + '</li>').join('')}</ul>
        </div>
        <div class="section fade"><h3>메이크업 팁</h3><p>${primary.makeupTips}</p></div>
        <div class="section fade"><h3>패션 팁</h3><p>${primary.fashionTips}</p></div>
        <div class="section fade"><h3>참고 연예인</h3><p>${primary.celebrities.join(' · ')}</p></div>
        <div class="fade" style="margin-bottom:1.25rem">
          <h3>유사한 타입</h3>
          <div class="similar">
            ${similar.map(t => `
              <div class="section" style="margin:0">
                <p class="eyebrow" style="color:${SEASON_ACCENT[t.season]};margin-bottom:.25rem">${SEASON_LABEL[t.season]}</p>
                <strong>${t.nameKo}</strong>
                ${swatches(t.bestColors.slice(0,4), true)}
              </div>
            `).join('')}
          </div>
        </div>
        <button class="btn btn-primary" id="retry">다시 진단하기</button>
        <p class="hint">본 결과는 참고용 자가 진단입니다.<br/>전문 퍼스널컬러 진단을 대체하지 않습니다.</p>
      `;
    }

    function render() {
      const app = document.getElementById('app');
      if (screen === 'home') app.innerHTML = renderHome();
      else if (screen === 'quiz') app.innerHTML = renderQuiz();
      else app.innerHTML = renderResult();
      bind();
    }

    function bind() {
      const start = document.getElementById('start');
      if (start) start.onclick = () => { screen = 'quiz'; step = 0; answers = {}; render(); };

      document.querySelectorAll('.choice').forEach(btn => {
        btn.onclick = () => {
          answers[QUESTIONS[step].id] = btn.dataset.id;
          render();
        };
      });

      const prev = document.getElementById('prev');
      if (prev) prev.onclick = () => { if (step > 0) { step--; render(); } };

      const next = document.getElementById('next');
      if (next) next.onclick = () => {
        if (!answers[QUESTIONS[step].id]) return;
        if (step < QUESTIONS.length - 1) { step++; render(); }
        else { screen = 'result'; render(); }
      };

      const retry = document.getElementById('retry');
      if (retry) retry.onclick = () => { screen = 'home'; step = 0; answers = {}; render(); };
    }

    render();
  </script>
</body>
</html>
